name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The CLI requires Node >= 20. Test against all currently-supported
        # majors so we catch regressions on either end.
        node: [20, 22, 24]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test bundled binary
        run: |
          node dist/index.js --help
          node dist/index.js skill > /tmp/skill.md
          test -s /tmp/skill.md
