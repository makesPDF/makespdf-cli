name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # id-token: write is required for OIDC trusted publishing to npm.
      # This lets the publish step exchange a short-lived GitHub Actions
      # OIDC token for an npm publish token — no long-lived NPM_TOKEN
      # secret exists anywhere.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      # Node 24, NOT 22. npm trusted publishing requires npm >= 11.5.1,
      # and Node 22 LTS is permanently stuck on npm 10.9.x. Latest Node 24
      # ships with npm 11.11.0.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # NPM_CONFIG_PROVENANCE=true stamps the package with a SLSA provenance
      # attestation via sigstore. Separate from trusted publishing, but both
      # work together — you want both.
      #
      # Note: using `npm publish` directly (not `pnpm publish`) so the OIDC
      # token exchange goes through the npm client that actually implements
      # trusted publishing.
      - name: Publish to npm
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
